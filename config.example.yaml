# Optional behaviour config for ibx_kentik_prepop.
#
# Everything here has a working default, so the YAML file is only needed to
# change site derivation behaviour or to correct an API path or field name
# without editing code. Credentials never belong in this file - they live in
# the ini.

source: uddi

site:
  # EA (NIOS) or tag (UDDI) key holding the site name. Also settable with
  # --site-key. Use --list-keys to see what is actually populated.
  site_key: Site

  # Optional EA/tag key overriding the Kentik address classification.
  # Accepted values on the object: infrastructure | user_access | other
  class_key: ''

  # Optional EA/tag key holding the site type, mapped through site_type_map.
  site_type_key: ''
  default_site_type: SITE_TYPE_BRANCH
  site_type_map:
    dc: SITE_TYPE_DATA_CENTER
    branch: SITE_TYPE_BRANCH
    cloud: SITE_TYPE_CLOUD

  # 0 disables aggregation beyond exact collapse. When set, summarised
  # prefixes are aggregated up to this prefix length, but only where the
  # supernet does not overlap another site's space.
  max_prefix_len: 0

  # Subnets at or below this prefix length are treated as infrastructure.
  infra_prefix_len: 30

  # Name/comment substrings that mark a subnet as infrastructure.
  infra_patterns:
    - mgmt
    - management
    - transit
    - p2p
    - loopback
    - infra
    - wan

  include_address_blocks: false

  # Kentik postal address and coordinates. Candidate EA/tag names per Kentik
  # field, matched case-insensitively, first hit wins. PostalAddress requires
  # address, city and country, so a partial address is reported and dropped.
  use_address: true
  address_keys:
    address: [address, street, street_address, site_address]
    city: [city, town]
    region: [region, state, county, province]
    postal_code: [postal_code, postcode, zip, zip_code]
    country: [country, country_code]
  geo_keys:
    lat: [latitude, lat]
    lon: [longitude, long, lon, lng]

device:
  enabled: false
  use_insight: false
  use_uai: false
  use_gateways: false
  roles:
    - router
    - switch
    - firewall

  # Fields and EA/tag names a device description is taken from, in order of
  # preference. Whatever is found leads the Kentik device_description, with the
  # vendor/model/version appended.
  description_keys:
    - description
    - comment
    - comments
    - notes
    - purpose
    - role

  # flow (default) or nms - both use the same device API, the mode decides
  # which fields are populated.
  mode: flow
  subtype: router

  # Licence plan for flow devices, resolved by name against GET /api/v5/plans.
  # Set plan_id when licensing is not visible to the service account, or to
  # pin a specific plan.
  plan_name: Free Flowpak Plan
  plan_id: 0
  # 1 = unsampled, which is the safe default for pre-population.
  sample_rate: 1
  minimize_snmp: true

  # mgmt (default) = the management address only; all = every discovered
  # interface address. Override per device in the web UI.
  sending_ips: mgmt

  # Kentik requires device_bgp_type on every create. 'none' means generic
  # IP/ASN mapping and needs nothing else; 'device' needs an ASN and a peering
  # address; 'other_device' needs the id of the device whose table is shared.
  bgp_type: none
  bgp_flowspec: false
  bgp_neighbor_asn: ''
  bgp_neighbor_ip: ''
  bgp_neighbor_ip6: ''
  bgp_device_id: ''

  # NMS only. An agent is required - a device created without one never polls.
  agent_id: ''
  credential_name: ''
  snmp_port: 161
  monitoring_template_id: 0

  # Devices that already exist are reported, not touched, unless this is set -
  # and then only their site and sending IPs change.
  update_existing: false
  allow_over_capacity: false

  # Names or management IPs to skip.
  exclude: []

# Endpoint and field overrides. Change these when an API path moves rather
# than editing the code.
uddi:
  # base_url: https://csp.eu.infoblox.com
  # asset_category: network
  page_size: 1000

nios:
  wapi_version: v2.13.1
  page_size: 1000

kentik:
  # base_url: https://api.kentik.eu
  # grpc_base_url: https://grpc.api.kentik.eu
  site_list: /site/v202211/sites

state_file: ibx_kentik_prepop_state.json
