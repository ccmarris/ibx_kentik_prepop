[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ibx_kentik_prepop"
version = "0.1.0"
description = "Pre-populate Kentik sites and devices from Infoblox NIOS or Universal DDI data"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Chris Marrison", email = "chris@infoblox.com" }]
dependencies = [
    "requests",
    "PyYAML",
]

[project.optional-dependencies]
web = ["flask"]
dev = ["pytest"]

[project.scripts]
ibx-kentik-prepop = "ibx_kentik_prepop.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
